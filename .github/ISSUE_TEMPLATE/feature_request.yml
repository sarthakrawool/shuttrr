name: Feature request
description: Suggest something Shuttrr should do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The job you want done, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
      description: How you picture it working. Optional.
  - type: input
    id: mac
    attributes:
      label: Your Mac
      description: Chip and memory, for example "M3 Pro, 36 GB". Helps us judge what fits.
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Models you would like supported, links, examples.
