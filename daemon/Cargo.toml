[package]
name = "shutterd"
version = "0.3.3"
edition = "2021"
description = "Shutter engine daemon: HTTP API, job queue, memory guard, GPU locks and the worker watchdog"
license = "MIT"
publish = false

[lib]
name = "shutterd"
path = "src/lib.rs"

[[bin]]
name = "shutterd"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", default-features = false, features = ["rt", "net", "time", "sync", "process", "io-util", "macros", "signal"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "query"] }
futures-core = "0.3"
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
libc = "0.2"
regex-lite = "0.1"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
